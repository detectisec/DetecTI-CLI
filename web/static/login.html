<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DetecTIHound - Login</title>
    <!-- Same fonts and base styles as the main app -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --bg-hover: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-cyan: #00f0ff;
            --accent-purple: #8b5cf6;
            --border-light: rgba(255, 255, 255, 0.1);
            --danger: #ef4444;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Subtle background grid pattern to match the hacker/cyber theme */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 0;
        }

        .login-container {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 240, 255, 0.1);
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .logo-title span {
            color: var(--accent-cyan);
        }

        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 12px;
            color: var(--text-muted);
            width: 18px;
            height: 18px;
        }

        .login-input {
            width: 100%;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-light);
            border-radius: 4px;
            padding: 10px 10px 10px 40px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .login-input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 1px var(--accent-cyan);
        }

        .login-btn {
            background-color: transparent;
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
            padding: 12px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-btn:hover {
            background-color: rgba(0, 240, 255, 0.1);
        }

        .login-btn:active {
            transform: translateY(1px);
        }

        .error-message {
            color: var(--danger);
            font-size: 0.85rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 10px;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            display: none;
            text-align: center;
            margin-bottom: 15px;
        }

        .footer-text {
            margin-top: 25px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-title">DetecTI<span>Hound</span></div>
        
        <div id="error-box" class="error-message"></div>

        <form id="login-form" class="login-form">
            <div class="input-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <i data-lucide="user"></i>
                    <input type="text" id="username" name="username" class="login-input" required autocomplete="username" spellcheck="false">
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i data-lucide="lock"></i>
                    <input type="password" id="password" name="password" class="login-input" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="login-btn">
                <i data-lucide="log-in" style="width: 18px; height: 18px;"></i>
                ACCESS SYSTEM
            </button>
        </form>

        <div class="footer-text">
            Unauthorized access is strictly prohibited.
        </div>
    </div>

    <script>
        lucide.createIcons();

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('error-box');
            const submitBtn = document.querySelector('.login-btn');
            
            errorBox.style.display = 'none';
            submitBtn.style.opacity = '0.7';
            submitBtn.style.pointerEvents = 'none';
            submitBtn.innerHTML = '<i data-lucide="loader" style="width: 18px; height: 18px; animation: spin 1s linear infinite;"></i> AUTHENTICATING...';
            lucide.createIcons();

            const formData = new URLSearchParams();
            formData.append('username', username);
            formData.append('password', password);

            try {
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData
                });

                if (response.ok) {
                    // Login successful, redirect to dashboard
                    submitBtn.style.color = '#10b981';
                    submitBtn.style.borderColor = '#10b981';
                    submitBtn.style.backgroundColor = 'rgba(16, 185, 129, 0.1)';
                    submitBtn.innerHTML = '<i data-lucide="check" style="width: 18px; height: 18px;"></i> ACCESS GRANTED';
                    lucide.createIcons();
                    
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 500);
                } else {
                    const data = await response.json();
                    errorBox.textContent = data.detail || 'Authentication failed';
                    errorBox.style.display = 'block';
                    resetButton();
                }
            } catch (err) {
                errorBox.textContent = 'Server connection error';
                errorBox.style.display = 'block';
                resetButton();
            }
            
            function resetButton() {
                submitBtn.style.opacity = '1';
                submitBtn.style.pointerEvents = 'auto';
                submitBtn.style.color = '';
                submitBtn.style.borderColor = '';
                submitBtn.style.backgroundColor = '';
                submitBtn.innerHTML = '<i data-lucide="log-in" style="width: 18px; height: 18px;"></i> ACCESS SYSTEM';
                lucide.createIcons();
            }
        });
        
        // Add spin animation CSS
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes spin {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
